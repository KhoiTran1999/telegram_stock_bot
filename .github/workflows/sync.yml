name: Sync to KhoiTran1999

on:
  push:
    branches: [ "main" ] # Hoặc "master" nếu nhánh chính của bạn tên là master

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to KhoiTran1999
        env:
          # Lấy secret gán vào một biến tên là API_TOKEN
          API_TOKEN: ${{ secrets.API_TOKEN_GITHUB_B }} 
        run: |
          # Cấu hình user
          git config --global user.email "khoitran200199@gmail.com"
          git config --global user.name "khoitran200199-lab"
          
          # Dùng biến $API_TOKEN thay vì viết trực tiếp
          # Cách này an toàn hơn và tránh lỗi cú pháp
          git push https://KhoiTran1999:$API_TOKEN@github.com/KhoiTran1999/telegram_stock_bot.git main --force
